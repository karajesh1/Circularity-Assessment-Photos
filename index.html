<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Circularity Photos</title>
<style>
:root{--y:#FAD83A;--k:#000;--g:#616568;--l:#EAEAEA;--l2:#DBE1E1;--ok:#1d7a3a;--okbg:#e3f4e8;--bad:#b3261e;--bg:#F4F5F5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:#141414;font:16px/1.45 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--k);color:#fff;padding:10px 14px calc(10px) 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:8px;font:700 15px system-ui;letter-spacing:.08em}.brand b{background:var(--y);color:#000;padding:0 3px}
.brand svg{color:var(--y)}
.ids{font-size:12px;color:#ccc;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ids strong{color:#fff}
.prog{height:5px;background:#333;border-radius:3px;margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--y);width:0;transition:width .3s}
main{padding:14px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:12px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:19px;margin:0}
.num{font-size:12px;color:var(--g);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.guide{color:#333;margin:8px 0 12px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.thumbs div{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--l)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:2px solid var(--k);background:#fff;color:#000;border-radius:999px;padding:13px 16px;font:600 16px system-ui;margin-top:8px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--k);color:var(--y)}.btn.yellow{background:var(--y);border-color:var(--y)}
.btn.ghost{border-color:var(--l2);color:var(--g)}.btn:disabled{opacity:.4}
.row{display:flex;gap:8px}.row .btn{flex:1}
input[type=text],select,textarea{width:100%;padding:11px;border:1px solid var(--l2);border-radius:10px;font:16px system-ui;background:#fff}
textarea{min-height:60px}
.count{font-size:13px;color:var(--g)}
.skipped{background:var(--l);border-radius:10px;padding:10px;margin:8px 0;font-size:14px}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--l)}
.list .it:last-child{border:0}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;background:var(--l);color:var(--g)}
.dot.ok{background:var(--ok);color:#fff}.dot.sk{background:#999;color:#fff}
nav.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:5}
nav.bar .btn{margin:0}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:20}
.busy{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:30;color:#fff;font-weight:600}
label.l{font-size:12px;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:.05em;display:block;margin:10px 0 4px}
</style>
</head>
<body>
<header>
  <div class="brand"><svg viewBox="0 0 48 48" width="22" height="22"><circle cx="24" cy="24" r="19" fill="none" stroke="currentColor" stroke-width="5"/><rect x="21.5" y="9" width="5" height="30" fill="currentColor"/></svg>CIRCULAR<b>IT</b>Y <span style="font-weight:500;letter-spacing:0;color:#bbb">&nbsp;Photos</span></div>
  <div class="ids" id="ids"></div>
  <div class="prog"><i id="prog"></i></div>
</header>
<main id="main"></main>
<nav class="bar hidden" id="bar"><button class="btn ghost" id="prev">‹ Back</button><button class="btn" id="list">☰</button><button class="btn primary" id="next">Next ›</button></nav>
<input type="file" accept="image/*" capture="environment" id="camIn" class="hidden">
<input type="file" accept="image/*" multiple id="galIn" class="hidden">
<script>
"use strict";
const CONF = {"sections": [{"key": "label", "title": "Serial / model label", "guide": "Flip the laptop. Close-up of the service tag / serial sticker so the text is sharp and readable.", "max_photos": 10}, {"key": "lid", "title": "Lid (A side)", "guide": "Laptop closed, lid facing up. Full lid in frame, then close-ups of any scratches or dents.", "max_photos": 10}, {"key": "screen", "title": "Screen & bezel (B side)", "guide": "Screen ON showing the white test screen. Straight-on shot, then angled shot to reveal scratches or pressure marks.", "max_photos": 10}, {"key": "keyboard", "title": "Keyboard & palm rest (C side)", "guide": "Laptop open flat. Whole keyboard + palm rest from above. Close-ups of worn or missing keys.", "max_photos": 10}, {"key": "touchpad", "title": "Touchpad", "guide": "Close-up of the touchpad and buttons.", "max_photos": 10}, {"key": "bottom", "title": "Bottom cover (D side)", "guide": "Laptop upside down on a soft cloth. Whole bottom; show screws and rubber feet.", "max_photos": 10}, {"key": "ports_left", "title": "Left side & ports", "guide": "Left edge straight-on so every port is visible.", "max_photos": 10}, {"key": "ports_right", "title": "Right side & ports", "guide": "Right edge straight-on so every port is visible.", "max_photos": 10}, {"key": "front_rear", "title": "Front & rear edges", "guide": "Front edge, then rear edge (hinge side).", "max_photos": 10}, {"key": "hinges", "title": "Hinges", "guide": "Close-up of both hinges with the lid at about 90 degrees.", "max_photos": 10}, {"key": "vents", "title": "Vents & exhaust", "guide": "Intake and exhaust grilles. Show dust build-up if any.", "max_photos": 10}, {"key": "adapter", "title": "Power adapter & cable", "guide": "Adapter with cable, then close-up of the adapter label (wattage / part number).", "max_photos": 10}, {"key": "damage", "title": "Damage close-ups", "guide": "Any cracks, dents, liquid marks or broken parts not already captured. Skip if none.", "max_photos": 10}, {"key": "accessories", "title": "Accessories / other", "guide": "Bag, box, docking station, stylus or anything else received with the unit.", "max_photos": 10}], "skip_reasons": ["Not applicable to this device", "Not present", "No issue to show", "Will add later", "Other"], "max_dimension": 2560, "jpeg_quality": 0.85, "company": "Circularity by Innomonk Technologies", "generated": "2026-09-28 14:05"} || {sections:[{key:"label",title:"Serial / model label",guide:"Close-up of the serial sticker."}],skip_reasons:["Not applicable","Other"],max_dimension:2560,jpeg_quality:.85,company:"Circularity"};
const $=(s,e=document)=>e.querySelector(s), esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SECS=CONF.sections; const MAX=s=>s.max_photos||10;
let A=null; // {id, sn, m, t}
let D={sections:{}}; // per-assessment state
let idx=0; let view="intro";

/* ---------------- storage (IndexedDB, survives reloads) */
const DB=new Promise((res,rej)=>{const r=indexedDB.open("circularity-photos",1);r.onupgradeneeded=()=>{r.result.createObjectStore("photos");r.result.createObjectStore("state")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function tx(store,mode,fn){const db=await DB;return new Promise((res,rej)=>{const t=db.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out instanceof IDBRequest?out.result:out);t.onerror=()=>rej(t.error)})}
const putPhoto=(k,b)=>tx("photos","readwrite",s=>s.put(b,k));
const getPhoto=k=>tx("photos","readonly",s=>s.get(k));
const delPhoto=k=>tx("photos","readwrite",s=>s.delete(k));
const saveState=()=>A&&tx("state","readwrite",s=>s.put({A,D},"cur:"+A.id));
const loadState=id=>tx("state","readonly",s=>s.get("cur:"+id));

function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
function busy(on,msg){let b=$("#busy");if(on){if(!b){b=document.createElement("div");b.id="busy";b.className="busy";document.body.appendChild(b)}b.textContent=msg||"Working…"}else b&&b.remove()}
const sec=k=>D.sections[k]||(D.sections[k]={photos:[],skipped:false,skip_reason:null,notes:""});
const doneCount=()=>SECS.filter(s=>{const e=D.sections[s.key];return e&&(e.photos.length||e.skipped)}).length;

/* ---------------- image resize (keeps EXIF orientation via <img>) */
function resize(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const m=CONF.max_dimension||2560;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,m/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error("encode failed")),"image/jpeg",CONF.jpeg_quality||.85)};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("Could not read image"))};img.src=url})}

/* ---------------- ZIP writer (store method, no dependencies) */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
async function makeZip(files){ // files: [{name, data:Uint8Array}]
  const enc=new TextEncoder();const parts=[];const central=[];let offset=0;
  const now=new Date();const dt=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1))&0xFFFF;const dd=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate())&0xFFFF;
  for(const f of files){const nm=enc.encode(f.name);const crc=crc32(f.data);const sz=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,dt,true);lh.setUint16(12,dd,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nm,f.data);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,dt,true);ch.setUint16(14,dd,true);ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),nm);offset+=30+nm.length+sz}
  const csize=central.reduce((a,b)=>a+b.length,0);
  const end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,csize,true);end.setUint32(16,offset,true);
  return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:"application/zip"})}

/* ---------------- views */
function header(){
  $("#ids").innerHTML=A?`<strong>${esc(A.id)}</strong> · S/N <strong>${esc(A.sn||"—")}</strong> · ${esc(A.m||"")}`:"Not linked to an assessment";
  $("#prog").style.width=A?(100*doneCount()/SECS.length)+"%":"0";
}
function render(){header();const m=$("#main");$("#bar").classList.toggle("hidden",view!=="section");
  if(view==="intro")return renderIntro(m);if(view==="section")return renderSection(m);if(view==="list")return renderList(m);if(view==="finish")return renderFinish(m)}
function renderIntro(m){
  if(!A){m.innerHTML=`<div class="card"><h1>Link to assessment</h1><p class="guide">Scan the QR code shown on the laptop. If you can't, type the Assessment ID shown in the tool.</p>
    <label class="l">Assessment ID</label><input type="text" id="aid" placeholder="CIR-20260925-…" autocapitalize="characters">
    <label class="l">Serial number</label><input type="text" id="asn" autocapitalize="characters"><label class="l">Technician</label><input type="text" id="atech">
    <button class="btn primary" id="go">Start</button></div>`;
    $("#go").onclick=async()=>{const id=$("#aid").value.trim().toUpperCase();if(!id){toast("Enter the Assessment ID");return}await link({id,sn:$("#asn").value.trim().toUpperCase(),m:"",t:$("#atech").value.trim()})};return}
  const n=doneCount();
  m.innerHTML=`<div class="card"><h1>${n?"Continue photos":"Photos for this laptop"}</h1><p class="guide">${SECS.length} sections. Take up to 10 photos per section, or skip a section with a reason. Photos are saved on this phone until you send them.</p>
    <button class="btn primary" id="begin">${n?`Continue (${n}/${SECS.length} done)`:"Start with section 1"}</button><button class="btn" id="ov">See all sections</button>
    ${n?`<button class="btn yellow" id="fin">Finish & send</button>`:""}</div>
    <div class="card"><p class="count">Tip: good light, no flash on glossy lids, fill the frame. Tap a thumbnail's × to delete it.</p></div>`;
  $("#begin").onclick=()=>{idx=Math.max(0,SECS.findIndex(s=>{const e=D.sections[s.key];return !(e&&(e.photos.length||e.skipped))}));if(idx<0)idx=0;view="section";render()};
  $("#ov").onclick=()=>{view="list";render()};const f=$("#fin");if(f)f.onclick=()=>{view="finish";render()};
}
async function renderSection(m){
  const s=SECS[idx];const e=sec(s.key);const full=e.photos.length>=MAX(s);
  m.innerHTML=`<div class="card"><div class="num">Section ${idx+1} of ${SECS.length}</div><h2>${esc(s.title)}</h2><p class="guide">${esc(s.guide||"")}</p>
    ${e.skipped?`<div class="skipped">Skipped - ${esc(e.skip_reason||"")} <a href="#" id="unskip">Undo</a></div>`:""}
    <div class="thumbs" id="th"></div><div class="count">${e.photos.length} / ${MAX(s)} photos</div>
    <button class="btn primary" id="cam" ${full?"disabled":""}>📷 Take photo</button>
    <button class="btn" id="gal" ${full?"disabled":""}>🖼 Add from gallery</button>
    ${e.photos.length||e.skipped?"":`<label class="l">Skip this section</label><div class="row"><select id="skr">${CONF.skip_reasons.map(r=>`<option>${esc(r)}</option>`).join("")}</select></div><button class="btn ghost" id="skip">Skip section</button>`}
    <label class="l">Notes (optional)</label><textarea id="notes" placeholder="e.g. dent near left hinge">${esc(e.notes||"")}</textarea></div>`;
  const th=$("#th");
  for(const p of e.photos){const b=await getPhoto(p.id);if(!b)continue;const u=URL.createObjectURL(b);const d=document.createElement("div");d.innerHTML=`<img src="${u}"><button aria-label="Delete">×</button>`;
    d.querySelector("button").onclick=async()=>{if(!confirm("Delete this photo?"))return;e.photos=e.photos.filter(x=>x.id!==p.id);await delPhoto(p.id);await saveState();render()};th.appendChild(d)}
  $("#cam").onclick=()=>$("#camIn").click();$("#gal").onclick=()=>$("#galIn").click();
  const sk=$("#skip");if(sk)sk.onclick=async()=>{e.skipped=true;e.skip_reason=$("#skr").value;await saveState();toast("Section skipped");next()};
  const us=$("#unskip");if(us)us.onclick=async ev=>{ev.preventDefault();e.skipped=false;e.skip_reason=null;await saveState();render()};
  $("#notes").onchange=async ev=>{e.notes=ev.target.value;await saveState()};
  $("#prev").disabled=idx===0;$("#next").textContent=idx===SECS.length-1?"Finish ›":"Next ›";
}
async function addFiles(files){
  const s=SECS[idx];const e=sec(s.key);let added=0;
  for(const f of files){if(e.photos.length>=MAX(s)){toast(`Maximum ${MAX(s)} photos for this section`);break}
    busy(true,"Saving photo…");try{const b=await resize(f);const id=`${A.id}|${s.key}|${Date.now()}|${Math.random().toString(36).slice(2,7)}`;await putPhoto(id,b);e.photos.push({id,taken_at:new Date().toISOString(),bytes:b.size});e.skipped=false;e.skip_reason=null;added++}catch(err){toast(err.message)}}
  busy(false);await saveState();if(added)toast(`${added} photo${added>1?"s":""} added`);render();
}
$("#camIn").onchange=ev=>{addFiles([...ev.target.files]);ev.target.value=""};
$("#galIn").onchange=ev=>{addFiles([...ev.target.files]);ev.target.value=""};
function next(){if(idx<SECS.length-1){idx++;view="section"}else view="finish";render();scrollTo(0,0)}
$("#next").onclick=next;$("#prev").onclick=()=>{if(idx>0){idx--;render();scrollTo(0,0)}};$("#list").onclick=()=>{view="list";render()};
function renderList(m){
  m.innerHTML=`<div class="card list">${SECS.map((s,i)=>{const e=D.sections[s.key]||{photos:[]};const st=e.photos.length?"ok":(e.skipped?"sk":"");
    return `<div class="it" data-i="${i}"><span class="dot ${st}">${e.photos.length?"✓":(e.skipped?"–":i+1)}</span><div style="flex:1"><strong>${esc(s.title)}</strong><div class="count">${e.photos.length?e.photos.length+" photos":(e.skipped?"Skipped: "+esc(e.skip_reason):"Not done")}</div></div>›</div>`}).join("")}</div>
    <button class="btn yellow" id="fin">Finish & send</button>`;
  m.querySelectorAll(".it").forEach(el=>el.onclick=()=>{idx=+el.dataset.i;view="section";render()});$("#fin").onclick=()=>{view="finish";render()};
}
function renderFinish(m){
  const missing=SECS.filter(s=>{const e=D.sections[s.key];return !(e&&(e.photos.length||e.skipped))});
  const total=SECS.reduce((a,s)=>a+((D.sections[s.key]||{photos:[]}).photos.length),0);
  m.innerHTML=`<div class="card"><h1>Finish & send</h1><p class="guide"><strong>${total}</strong> photos in ${SECS.length-missing.length} of ${SECS.length} sections.</p>
    ${missing.length?`<div class="skipped">Not done: ${missing.map(s=>esc(s.title)).join(", ")}. They will be marked "missing" - you can send another ZIP later.</div>`:""}
    <button class="btn primary" id="share">📤 Create ZIP & Share</button><button class="btn" id="dl">⬇ Save ZIP to phone</button>
    <p class="count" style="margin-top:12px">Share to the <strong>Circularity Photos</strong> folder (Google Drive / OneDrive) - the assessment tool imports it automatically. Or save it and copy it to the laptop by cable.</p>
    <button class="btn ghost" id="back">‹ Back to sections</button></div>
    <div class="card"><button class="btn ghost" id="newL">Done - clear this phone for the next laptop</button></div>`;
  $("#share").onclick=()=>send(true);$("#dl").onclick=()=>send(false);$("#back").onclick=()=>{view="list";render()};
  $("#newL").onclick=async()=>{if(!confirm("Clear all photos of "+A.id+" from this phone? Only do this after the ZIP has been sent."))return;for(const s of SECS)for(const p of (D.sections[s.key]||{photos:[]}).photos)await delPhoto(p.id);await tx("state","readwrite",st=>st.delete("cur:"+A.id));A=null;D={sections:{}};history.replaceState(null,"",location.pathname);view="intro";render()};
}
async function buildZip(){
  busy(true,"Building ZIP…");const files=[];const man={format:"circularity-photos/1",assessment_id:A.id,serial:A.sn,model:A.m,technician:A.t,created_at:new Date().toISOString(),device:navigator.userAgent,sections:[]};
  let si=0;for(const s of SECS){si++;const e=D.sections[s.key]||{photos:[]};const ms={key:s.key,title:s.title,skipped:!!e.skipped&&!e.photos.length,skip_reason:e.skip_reason,notes:e.notes||"",files:[]};
    let k=0;for(const p of e.photos){const b=await getPhoto(p.id);if(!b)continue;k++;const name=`photos/${String(si).padStart(2,"0")}_${s.key}/${A.id}_${s.key}_${String(k).padStart(2,"0")}.jpg`;
      files.push({name,data:new Uint8Array(await b.arrayBuffer())});ms.files.push({name:name.split("/").pop(),path:name,taken_at:p.taken_at,bytes:b.size})}
    man.sections.push(ms)}
  files.unshift({name:"manifest.json",data:new TextEncoder().encode(JSON.stringify(man,null,1))});
  const zip=await makeZip(files);busy(false);const d=new Date();const stamp=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}-${String(d.getHours()).padStart(2,"0")}${String(d.getMinutes()).padStart(2,"0")}`;
  return new File([zip],`${A.id}_photos_${stamp}.zip`,{type:"application/zip"})}
async function send(share){
  const f=await buildZip();
  if(share&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:f.name,text:`Circularity photos ${A.id}`});toast("Shared");return}catch(e){if(e.name==="AbortError")return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();toast(share?"Sharing not supported - ZIP saved instead":"ZIP saved to Downloads");
}
async function link(a){A=a;const st=await loadState(a.id);D=st?st.D:{sections:{}};if(st&&!A.m)A=Object.assign({},st.A,a,{m:a.m||st.A.m});await saveState();view="intro";render()}

(async()=>{const p=new URLSearchParams(location.hash.slice(1));const id=p.get("id");
  if(id)await link({id,sn:p.get("sn")||"",m:p.get("m")||"",t:p.get("t")||""});else render()})();
</script>
</body>
</html>
